services:
  manga-crawler-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: manga-crawler-backend
    restart: unless-stopped
    working_dir: /app
    command: ./manga-crawler-backend
    environment:
      - TZ=Etc/GMT
    env_file:
      - .env
    ports:
      - "8080:8080"
